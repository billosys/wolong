name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5.0.4"
          rebar3-version: "3.27.0"

      - name: Compile (warnings-as-errors)
        run: rebar3 compile

      - name: Test (eunit, incl. the erlexec probe)
        run: rebar3 as test eunit

      - name: Xref
        run: rebar3 xref

      - name: Dialyzer
        run: rebar3 dialyzer
